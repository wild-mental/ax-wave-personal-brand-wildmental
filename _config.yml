# GitHub Pages (Jekyll) 설정 — 온라인 자료실
# 기본 플러그인(optional-front-matter, readme-index, relative-links, titles-from-headings)이
# 앞머리(front matter) 없는 .md 파일을 페이지로 바꾸고, README.md를 각 폴더의 첫 화면으로 쓰고,
# guides/xxx.md 같은 상대 링크를 .html로 이어 줍니다.
title: 개인 브랜드 웹서비스 기획·구현 · 온라인 자료실
lang: ko
theme: jekyll-theme-primer

# 학생에게 보이지 않아야 하는 작업용 파일 (밑줄로 시작하는 폴더는 기본으로 빠짐)
# worksheet-template은 github.com 저장소 화면에서 열어 Copy raw file · Download raw file로 받으므로 사이트에서 뺍니다.
exclude:
  - CLAUDE.md
  - worksheet-template
